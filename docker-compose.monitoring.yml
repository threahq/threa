# Monitoring stack for local development
# Includes: Prometheus (metrics), Grafana (dashboards)
#
# Run with: docker compose -f docker-compose.monitoring.yml up -d
# Stop with: docker compose -f docker-compose.monitoring.yml stop
# Remove: docker compose -f docker-compose.monitoring.yml down -v
#
# Access:
#   - Prometheus: http://localhost:9090
#   - Grafana: http://localhost:3200 (admin/admin)

services:
  # ==============================================================================
  # Prometheus - Metrics Collection
  # ==============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: threa-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==============================================================================
  # Grafana - Dashboards & Visualization
  # ==============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: threa-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3200:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  prometheus-data:
  grafana-data:
