<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Threa</title>

    <!-- Primary Meta Tags -->
    <!-- The app shell is login-walled and every route serves this same HTML;
         indexing it would only compete with threa.io (the marketing site and
         canonical search presence). noindex still lets link unfurlers read the
         Open Graph tags below. -->
    <meta name="robots" content="noindex" />
    <meta name="title" content="Threa — AI-Powered Knowledge Chat" />
    <meta
      name="description"
      content="Where critical information comes to thrive. AI-powered knowledge management that grows with you."
    />
    <meta name="theme-color" content="#C8A055" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#8B7332" media="(prefers-color-scheme: light)" />

    <!-- Favicons: Dark mode (gold on dark) -->
    <link rel="icon" type="image/svg+xml" href="/threa-favicon.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="48x48" href="/threa-favicon-48.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/threa-favicon-32.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/threa-favicon-16.png" media="(prefers-color-scheme: dark)" />

    <!-- Favicons: Light mode (dark gold on light) -->
    <link rel="icon" type="image/svg+xml" href="/threa-favicon-light.svg" media="(prefers-color-scheme: light)" />

    <!-- Fallback favicon (ICO for legacy browsers) -->
    <link rel="icon" type="image/x-icon" href="/threa-favicon.ico" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/threa-logo-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/threa-logo-192.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/threa-logo-128.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.threa.io/" />
    <meta property="og:title" content="Threa — AI-Powered Knowledge Chat" />
    <meta
      property="og:description"
      content="Where critical information comes to thrive. AI-powered knowledge management that grows with you."
    />
    <meta property="og:image" content="https://app.threa.io/threa-logo-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:site_name" content="Threa" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://app.threa.io/" />
    <meta name="twitter:title" content="Threa — AI-Powered Knowledge Chat" />
    <meta
      name="twitter:description"
      content="Where critical information comes to thrive. AI-powered knowledge management that grows with you."
    />
    <meta name="twitter:image" content="https://app.threa.io/threa-logo-512.png" />

    <!-- Fonts — all self-hosted (Switzer body/UI, Commit Mono data, OpenDyslexic accessibility);
         @font-face in src/index.css. Preload the variable body face so first paint has it
         without a round-trip. OpenDyslexic is fetched by the browser only when the
         accessibility font preference applies it. -->
    <link rel="preload" href="/fonts/switzer.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Entry-load failure card. Lives outside #root and uses no bundle CSS, since
         it only shows when the bundle never ran; the @font-face repeats index.css's
         so the preloaded Switzer applies. Sizes and colors mirror the error
         boundary's Empty + Button, from index.css's light and .dark tokens. */
      @font-face {
        font-family: "Switzer";
        src: url("/fonts/switzer.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      #entry-failure {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: hsl(40 20% 98%);
        color: hsl(30 10% 12%);
        font-family:
          "Switzer",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        text-align: center;
        --muted: hsl(30 8% 45%);
        --primary: hsl(38 65% 50%);
        --primary-foreground: hsl(40 20% 98%);
      }
      #entry-failure[hidden] {
        display: none;
      }
      .dark #entry-failure {
        background: hsl(30 15% 8%);
        color: hsl(35 15% 92%);
        --muted: hsl(35 10% 55%);
        --primary: hsl(40 55% 55%);
        --primary-foreground: hsl(30 15% 8%);
      }
      #entry-failure > div {
        max-width: 384px;
      }
      #entry-failure h1 {
        margin: 0 0 8px;
        font-size: 18px;
        line-height: 28px;
        font-weight: 500;
        letter-spacing: -0.025em;
      }
      #entry-failure p {
        margin: 0 0 16px;
        font-size: 14px;
        line-height: 1.625;
        color: var(--muted);
      }
      #entry-failure button {
        height: 40px;
        padding: 0 16px;
        border: 0;
        border-radius: 10px;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        background: var(--primary);
        color: var(--primary-foreground);
        cursor: pointer;
      }
      #entry-failure a {
        display: block;
        margin-top: 16px;
        font-size: 14px;
        color: var(--muted);
        text-underline-offset: 4px;
      }
    </style>
    <script>
      ;(function () {
        var root = document.documentElement
        var prefs
        try {
          prefs = JSON.parse(localStorage.getItem("threa-appearance")) || {}
        } catch (e) {
          prefs = {}
        }

        // Theme (with system preference fallback)
        var theme = prefs.theme
        var prefersDark =
          theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        if (prefersDark) root.classList.add("dark")

        // Accessibility
        if (prefs.fontSize) root.dataset.fontSize = prefs.fontSize
        if (prefs.fontFamily) root.dataset.fontFamily = prefs.fontFamily
        if (prefs.reducedMotion) root.classList.add("reduced-motion")
        if (prefs.highContrast) root.classList.add("high-contrast")

        // Message display
        if (prefs.messageDisplay) root.dataset.messageDisplay = prefs.messageDisplay

        // Entry-load failure card: a module script that 404s or never arrives
        // otherwise leaves a blank page, since the CSS watchdog only reacts to
        // missing styles and crash recovery lives in the bundle that never ran.
        // Manual reload only, so it can't loop against the sw-recovery cap.
        // src/main.tsx calls __threaEntryLoaded as its first statement, which
        // removes the card and with it every later show.
        var ENTRY_LOAD_TIMEOUT_MS = 30000
        var reportEntryFailure = function (trigger, url) {
          // Only with a consent-backed analytics scope persisted by
          // src/lib/analytics/posthog.ts: same project, same person, same
          // consent as in-app capture. Rate-limited so a device that never
          // loads doesn't report on every retry.
          try {
            var scope = JSON.parse(localStorage.getItem("threa-analytics") || "null")
            if (!scope || !scope.token || !scope.host || !scope.distinctId) return
            var reportedAt = parseInt(localStorage.getItem("threa-entry-failure-reported-at") || "0", 10)
            if (reportedAt && Date.now() - reportedAt < 6 * 60 * 60 * 1000) return
            localStorage.setItem("threa-entry-failure-reported-at", String(Date.now()))
            var connection = navigator.connection || {}
            var event = {
              api_key: scope.token,
              event: "app_entry_load_failed",
              distinct_id: scope.distinctId,
              timestamp: new Date().toISOString(),
              properties: {
                $lib: "threa-shell",
                trigger: trigger,
                asset_url: url,
                online: navigator.onLine,
                effective_type: connection.effectiveType,
                downlink: connection.downlink,
                standalone: navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches,
              },
            }
            // posthog-js's own beacon encoding: form body with base64 JSON, a
            // CORS-safelisted content type so sendBeacon needs no preflight.
            var data = btoa(unescape(encodeURIComponent(JSON.stringify(event))))
            navigator.sendBeacon(
              scope.host + "/e/?ip=1&_=" + Date.now() + "&compression=base64",
              new Blob(["data=" + encodeURIComponent(data)], { type: "application/x-www-form-urlencoded" })
            )
          } catch (e) {
            // Storage denied or no beacon support: the card still shows.
          }
        }
        var showEntryFailure = function (trigger, url) {
          var card = document.getElementById("entry-failure")
          if (!card || !card.hidden) return
          card.hidden = false
          reportEntryFailure(trigger, url)
        }
        var entryLoadTimer = setTimeout(function () {
          showEntryFailure("timeout", "")
        }, ENTRY_LOAD_TIMEOUT_MS)
        window.addEventListener(
          "error",
          function (event) {
            // A module script's error event also covers a failed dependency
            // fetch anywhere in its graph, so the entry script alone suffices.
            var target = event.target
            if (target && target.tagName === "SCRIPT" && target.type === "module") {
              showEntryFailure("script-error", target.src || "")
            }
          },
          true
        )
        window.__threaEntryLoaded = function () {
          clearTimeout(entryLoadTimer)
          var card = document.getElementById("entry-failure")
          if (card) card.remove()
        }

        // Eager auth fetch — start before the JS bundle loads so the network
        // round-trip overlaps with script parse/eval instead of running after it.
        // 401 resolves to null (unauthenticated). Other errors reject so
        // AuthProvider can fall through to a normal fetch with proper error handling.
        // Bounded so a dead/slow network rejects (→ cached identity) instead of
        // leaving AuthProvider awaiting a promise that never settles. Keep this
        // 15000 in sync with AUTH_REVALIDATE_TIMEOUT_MS in src/auth/context.tsx
        // — index.html can't import the TS constant, so the two are unlinked.
        var eagerAuthController = new AbortController()
        var eagerAuthTimeout = setTimeout(function () {
          eagerAuthController.abort()
        }, 15000)
        window.__eagerAuthPromise = fetch("/api/auth/me", {
          credentials: "include",
          signal: eagerAuthController.signal,
        })
          .then(function (res) {
            if (res.status === 401) return null
            if (!res.ok) throw new Error("Failed to fetch user")
            return res.json()
          })
          .finally(function () {
            clearTimeout(eagerAuthTimeout)
          })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="entry-failure" hidden role="alert">
      <div>
        <h1>Threa didn't load</h1>
        <p>Check your connection, then try again.</p>
        <button type="button" onclick="location.reload()">Reload</button>
        <a href="/recover.html">Still stuck? Reset the app</a>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // CSS watchdog: capped plain reload when no same-origin stylesheet has
      // loaded after a CSS request completed. Shares the sw-recovery-attempts
      // counter with src/lib/sw-recovery.ts so both paths can't loop past the
      // shared cap. Automatic recovery deliberately does not unregister SWs or
      // delete caches.
      ;(function () {
        var attempts
        try {
          attempts = parseInt(sessionStorage.getItem("sw-recovery-attempts") || "0", 10)
          if (attempts >= 2) return
        } catch (e) {
          // Storage denied: can't cap reloads, so don't auto-reload.
          return
        }
        var check = function () {
          var hasStyles = false
          var sheets = document.styleSheets
          for (var i = 0; i < sheets.length; i++) {
            try {
              if (sheets[i].cssRules && sheets[i].cssRules.length > 0) {
                hasStyles = true
                break
              }
            } catch (e) {
              // Cross-origin stylesheet (e.g. Google Fonts) — skip and keep checking
            }
          }
          if (hasStyles) {
            // A broken JS chunk still loads CSS, so only clear the counter when
            // the last attempt is old enough that the app has been healthy since.
            // Cooldown mirrors src/lib/sw-recovery.ts.
            try {
              var last = parseInt(sessionStorage.getItem("sw-recovery-last") || "0", 10)
              if (!last || Date.now() - last > 60000) {
                sessionStorage.removeItem("sw-recovery-attempts")
                sessionStorage.removeItem("sw-recovery-last")
              }
            } catch (e) {
              // Storage denied; leave counters alone.
            }
            return
          }
          // An in-flight stylesheet may still succeed. Reloading would restart
          // its download, so wait for completion before considering recovery.
          var cssFinished = false
          try {
            var entries = performance.getEntriesByType("resource")
            for (var j = 0; j < entries.length; j++) {
              if (
                entries[j].initiatorType === "link" &&
                /\.css(\?|$)/.test(entries[j].name) &&
                entries[j].responseEnd > 0
              ) {
                cssFinished = true
                break
              }
            }
          } catch (e) {
            // No Performance API — assume completed so the recovery still runs.
            cssFinished = true
          }
          if (!cssFinished) {
            setTimeout(check, 3000)
            return
          }
          // Completed stylesheet produced no rules: capped plain reload only.
          try {
            var currentAttempts = parseInt(sessionStorage.getItem("sw-recovery-attempts") || "0", 10)
            if (currentAttempts >= 2) return
            sessionStorage.setItem("sw-recovery-attempts", String(currentAttempts + 1))
            sessionStorage.setItem("sw-recovery-last", String(Date.now()))
          } catch (e) {
            // Storage denied: can't cap reloads, so don't auto-reload.
            return
          }
          location.reload()
        }
        setTimeout(check, 3000)
      })()
    </script>
  </body>
</html>
