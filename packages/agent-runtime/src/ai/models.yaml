# Model Capabilities Registry
#
# Defines input/output modalities for each model following OpenRouter modality format.
# This is the source of truth for model capabilities in the codebase, and it is
# also what the persona model picker offers (`listAvailableModels`).
#
# Scope: current-generation models from Anthropic, Google and OpenAI only.
# Restricted to those three so every model here can be run regionally, either
# through OpenRouter or direct with the provider. Superseded generations are
# removed rather than left selectable — an entry here is an offer.
#
# Removing an entry is not free: `supportsVision` returns false for an unknown
# model, so a persona still pinned to a removed id silently stops receiving
# image attachments. Check `personas.model`, `personas.escalation_model` and
# `agent_config_overrides.patch->>'model'` before dropping one.
#
# `inputModalities` is deliberately narrower than what the providers accept —
# the Gemini models also take video and audio, but no code path feeds them
# either, and `audio` here would make `supportsAudioInput` true and offer the
# model to the voice-transcription strategy registry.
#
# See docs/model-reference.md for pricing, cache rates, and usage guidance.

models:
  # Anthropic
  openrouter:anthropic/claude-opus-5:
    name: Claude Opus 5
    inputModalities: [text, image]
    outputModalities: [text]

  openrouter:anthropic/claude-sonnet-5:
    name: Claude Sonnet 5
    inputModalities: [text, image]
    outputModalities: [text]

  openrouter:anthropic/claude-sonnet-4.6:
