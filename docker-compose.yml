services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "5454:5432"
    environment:
      POSTGRES_USER: threa
      POSTGRES_PASSWORD: threa
      POSTGRES_DB: threa
    command: >
      postgres
      -c max_connections=100
      -c idle_session_timeout=0
      -c tcp_keepalives_idle=30
      -c tcp_keepalives_interval=10
      -c tcp_keepalives_count=3
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threa -d threa"]
      interval: 2s
      timeout: 5s
      retries: 10

  minio:
    image: chrislusf/seaweedfs:4.47
    ports:
      - "9099:9000"
      - "9001:9001"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: mini -dir=/data -s3.port=9000 -admin.port=9001 -bucket=threa-uploads
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  seaweedfs_data:
