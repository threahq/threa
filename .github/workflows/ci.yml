name: CI

on:
  pull_request:
    paths:
      - ".bun-version"
      - ".github/actions/**"
      - "Dockerfile*"
      - "apps/**"
      - "packages/**"
      - "extensions/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-main-tip:
    name: Check main tip
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check main tip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: tip
        uses: ./.github/actions/check-main-tip
        with:
          expected-sha: ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Reject obsolete main revision
        if: steps.tip.outputs.is-tip == 'false'
        run: exit 1

  lint:
    name: Lint
    needs: check-main-tip
    if: >-
      ${{ !cancelled() &&
          (needs.check-main-tip.result == 'success' ||
           (needs.check-main-tip.result == 'skipped' &&
            (github.event_name != 'push' || github.ref != 'refs/heads/main'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check API docs are up to date
        run: bun run generate:api-docs:check

  typecheck:
    name: Typecheck
    needs: check-main-tip
    if: >-
      ${{ !cancelled() &&
          (needs.check-main-tip.result == 'success' ||
           (needs.check-main-tip.result == 'skipped' &&
            (github.event_name != 'push' || github.ref != 'refs/heads/main'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Full monorepo tsc, not just the enclave: catches cross-workspace type
      # drift (e.g. squash-merge collisions) at PR time, before it can reach the
      # Deploy Cloudflare build — which is the only other place `tsc` runs.
      - name: Typecheck all workspaces
        run: bun run typecheck

  test:
    name: Tests (${{ matrix.partition }})
    needs: check-main-tip
    if: >-
      ${{ !cancelled() &&
          (needs.check-main-tip.result == 'success' ||
           (needs.check-main-tip.result == 'skipped' &&
            (github.event_name != 'push' || github.ref != 'refs/heads/main'))) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [backend, backend-integration, packages]

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: threa
          POSTGRES_PASSWORD: threa
          POSTGRES_DB: threa
        ports:
          - 5454:5432
        options: >-
          --health-cmd "pg_isready -U threa -d threa"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # published-sdk-consumer.test.ts packs bot-runtime-client, whose
      # declaration build needs its own deps (mdast) that the root install
      # does not hoist.
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd extensions/bot-runtime-client

      - name: Run scripts tests
        if: matrix.partition == 'packages'
        run: bun run test:scripts

      - name: Create test databases
        run: |
          PGPASSWORD=threa psql -h localhost -p 5454 -U threa -d postgres -c "CREATE DATABASE threa_test;"
          PGPASSWORD=threa psql -h localhost -p 5454 -U threa -d postgres -c "CREATE DATABASE threa_control_plane_test;"

      - name: Start MinIO
        run: |
          docker run -d -p 9000:9000 --name minio \
            -e AWS_ACCESS_KEY_ID=minioadmin \
            -e AWS_SECRET_ACCESS_KEY=minioadmin \
            chrislusf/seaweedfs:4.47 mini -dir=/data -s3.port=9000 -bucket=threa-test-uploads
          # Wait for MinIO to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:9000/healthz; then
              echo "MinIO is ready"
              break
            fi
            echo "Waiting for MinIO... ($i)"
            sleep 1
          done

      - name: Run backend tests
        if: matrix.partition == 'backend'
        run: bun run test
        env:
          TEST_DATABASE_URL: postgresql://threa:threa@localhost:5454/threa_test
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: threa-test-uploads
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin

      - name: Run backend integration tests
        if: matrix.partition == 'backend-integration'
        run: bun run --cwd apps/backend test:integration tests/integration/
        env:
          TEST_DATABASE_URL: postgresql://threa:threa@localhost:5454/threa_test
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: threa-test-uploads
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin

      - name: Run control-plane tests
        if: matrix.partition == 'packages'
        run: bun run --cwd apps/control-plane test
        env:
          TEST_DATABASE_URL: postgresql://threa:threa@localhost:5454/threa_control_plane_test

      - name: Run workspace-router tests
        if: matrix.partition == 'packages'
        run: bun run --cwd apps/workspace-router test

      - name: Run enclave tests
        if: matrix.partition == 'packages'
        run: bun run --cwd apps/enclave test

      - name: Run cli tests
        if: matrix.partition == 'packages'
        run: bun run --cwd packages/cli test

      - name: Run shared package tests
        if: matrix.partition == 'packages'
        run: |
          bun run --cwd packages/types test
          bun run --cwd packages/backend-common test
          bun run --cwd packages/prosemirror test
          bun run --cwd packages/agent-runtime test
          bun run --cwd packages/user-guide test

  frontend-tests:
    name: Frontend Tests (${{ matrix.shard_index }}/${{ strategy.job-total }})
    needs: check-main-tip
    if: >-
      ${{ !cancelled() &&
          (needs.check-main-tip.result == 'success' ||
           (needs.check-main-tip.result == 'skipped' &&
            (github.event_name != 'push' || github.ref != 'refs/heads/main'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        run: bun run --cwd apps/frontend test -- --shard=${{ matrix.shard_index }}/${{ strategy.job-total }}

  extension-tests:
    name: Extension Tests
    needs: check-main-tip
    if: >-
      ${{ !cancelled() &&
          (needs.check-main-tip.result == 'success' ||
           (needs.check-main-tip.result == 'skipped' &&
            (github.event_name != 'push' || github.ref != 'refs/heads/main'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for extension changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            extensions:
              - '.bun-version'
              - '.github/actions/**'
              - 'extensions/**'
              - '.github/workflows/ci.yml'

      - name: Setup Bun
        if: github.event_name != 'pull_request' || steps.filter.outputs.extensions == 'true'
        uses: ./.github/actions/setup-bun

      # Extensions live outside the root Bun workspaces (apps/*, packages/*):
      # each is a standalone package with its own bun.lock, linked by file:
      # deps (bot-runtime-client → harness-client/remote-session → claude-code-remote), so
      # installs must run per-package in dependency order. pi-remote is a
      # pi-package with tests but no standalone typecheck (deferred per #1153).
      # The root install is also required: bot-runtime-client's crypto parity
      # test typechecks against the canonical packages/crypto sources, whose
      # deps (@hpke/*) resolve from the root node_modules.
      - name: Install extension dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.extensions == 'true'
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd extensions/bot-runtime-client
          bun install --frozen-lockfile --cwd extensions/harness-client
          bun install --frozen-lockfile --cwd extensions/pi-remote
          bun install --frozen-lockfile --cwd extensions/remote-session
          bun install --frozen-lockfile --cwd extensions/claude-code-remote
          bun install --frozen-lockfile --cwd extensions/harness-daemon
          bun install --frozen-lockfile --cwd extensions/threa-bot
          bun install --frozen-lockfile --cwd extensions/hermes-remote
          bun install --frozen-lockfile --cwd extensions/t3code-remote

      - name: Typecheck extensions
        if: github.event_name != 'pull_request' || steps.filter.outputs.extensions == 'true'
        run: |
          bun run --cwd extensions/bot-runtime-client typecheck
          bun run --cwd extensions/harness-client typecheck
          bun run --cwd extensions/remote-session typecheck
          bun run --cwd extensions/claude-code-remote typecheck
          bun run --cwd extensions/harness-daemon typecheck
          bun run --cwd extensions/threa-bot typecheck
          bun run --cwd extensions/hermes-remote typecheck
          bun run --cwd extensions/t3code-remote typecheck

      - name: Run extension tests
        if: github.event_name != 'pull_request' || steps.filter.outputs.extensions == 'true'
        run: |
          bun run --cwd extensions/bot-runtime-client test
          bun run --cwd extensions/harness-client test
          bun run --cwd extensions/pi-remote test
          bun run --cwd extensions/remote-session test
          bun run --cwd extensions/claude-code-remote test
          bun run --cwd extensions/harness-daemon test
          bun run --cwd extensions/threa-bot test
          bun run --cwd extensions/hermes-remote test
          bun run --cwd extensions/t3code-remote test

  public-site-build:
    name: Public Site Build
    needs: check-main-tip
    if: >-
      ${{ !cancelled() &&
          (needs.check-main-tip.result == 'success' ||
           (needs.check-main-tip.result == 'skipped' &&
            (github.event_name != 'push' || github.ref != 'refs/heads/main'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for public-site changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            site:
              - '.bun-version'
              - '.github/actions/**'
              - 'apps/public-site/**'
              - 'packages/user-guide/**'
              - 'packages/types/**'
              - '.github/workflows/ci.yml'

      - name: Setup Bun
        if: github.event_name != 'pull_request' || steps.filter.outputs.site == 'true'
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.site == 'true'
        run: bun install --frozen-lockfile

      # The full build, not just astro check: build-llms.ts runs post-build and
      # fails on any docs page missing its PAGES entry — a guard that otherwise
      # only fires in the deploy workflow, after merge (see #1383).
      - name: Build public site
        if: github.event_name != 'pull_request' || steps.filter.outputs.site == 'true'
        run: bun run --cwd apps/public-site build

      # After the build: the markdown-negotiation test resolves each page route
      # against the mirrors that build just wrote.
      - name: Test public site
        if: github.event_name != 'pull_request' || steps.filter.outputs.site == 'true'
        run: bun run --cwd apps/public-site test

  frontend-prod-build:
    name: Frontend Production Build
    needs: check-main-tip
    if: >-
      ${{ !cancelled() &&
          (needs.check-main-tip.result == 'success' ||
           (needs.check-main-tip.result == 'skipped' &&
            (github.event_name != 'push' || github.ref != 'refs/heads/main'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: bun run --cwd apps/frontend build

      - name: Build deployable frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          POSTHOG_CLI_TOKEN: ${{ secrets.POSTHOG_CLI_TOKEN }}
          POSTHOG_ENV_ID_EU: ${{ secrets.POSTHOG_ENV_ID_EU }}
          POSTHOG_ENV_ID_US: ${{ secrets.POSTHOG_ENV_ID_US }}
        run: bun run --cwd apps/frontend build

      - name: Strip source maps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: find apps/frontend/dist -name '*.map' -type f -delete

      - name: Upload deployable frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production
          path: apps/frontend/dist
          if-no-files-found: error
          overwrite: true

  app-update-browser:
    name: App Update Browser Proof (${{ matrix.browser }})
    needs: check-main-tip
    if: >-
      ${{ !cancelled() &&
          (needs.check-main-tip.result == 'success' ||
           (needs.check-main-tip.result == 'skipped' &&
            (github.event_name != 'push' || github.ref != 'refs/heads/main'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    # The image ships the browsers' system packages. `playwright install-deps`
    # on the runner fetches them from the Azure Ubuntu mirror, which has stalled
    # past the job timeout and cancelled main's CI (no Cloudflare deploy).
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-bun needs `unzip`, which the image lacks.
      - name: Setup Bun
        run: npm install -g "bun@$(cat .bun-version)"

      - uses: ./.github/actions/bun-install-cache
        with:
          share-across-jobs: "false"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A no-op while the lockfile matches the image; after a Playwright bump it
      # fetches the matching browsers from the CDN, no apt involved.
      - name: Install Playwright browsers
        run: bunx playwright install ${{ matrix.browser }}

      - name: Run app-update browser proof
        run: bun run test:app-update --project=${{ matrix.browser }}
        env:
          CI: true

  workos-permissions:
    name: WorkOS Permissions
    needs: check-main-tip
    if: >-
      ${{ !cancelled() &&
          (needs.check-main-tip.result == 'success' ||
           (needs.check-main-tip.result == 'skipped' &&
            (github.event_name != 'push' || github.ref != 'refs/heads/main'))) }}
    runs-on: ubuntu-latest
    concurrency:
      group: workos-permissions-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || github.run_id }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for permission file changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            toolchain:
              - '.bun-version'
              - '.github/actions/**'
            permissions:
              - 'packages/types/src/api-keys.ts'
              - 'packages/types/src/workspace-permissions.ts'
              - 'scripts/sync-workos-permissions.ts'

      - name: Setup Bun
        if: github.event_name != 'pull_request' || steps.filter.outputs.permissions == 'true' || steps.filter.outputs.toolchain == 'true'
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.permissions == 'true' || steps.filter.outputs.toolchain == 'true'
        run: bun install --frozen-lockfile

      # On PRs: check for drift when permission files change
      - name: Check for permission drift
        if: github.event_name == 'pull_request' && steps.filter.outputs.permissions == 'true'
        run: bun run workos:check
        env:
          WORKOS_API_KEY: ${{ secrets.WORKOS_PROD_API_KEY }}

      # On every merge to main: sync permissions to production WorkOS
      - name: Check main tip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: tip
        uses: ./.github/actions/check-main-tip
        with:
          expected-sha: ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Reject obsolete main revision
        if: steps.tip.outputs.is-tip == 'false'
        run: exit 1

      - name: Sync permissions to WorkOS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bun run workos:sync
        env:
          WORKOS_API_KEY: ${{ secrets.WORKOS_PROD_API_KEY }}
