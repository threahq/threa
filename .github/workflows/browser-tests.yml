name: Browser worker paired experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-pairs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: true
      PLAYWRIGHT_SINGLE_REGION: "1"
      PLAYWRIGHT_FRONTEND_PREBUILT: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Record experiment environment
        run: |
          mkdir -p worker-pairs
          date +%s.%N > worker-pairs/job-start.txt
          git rev-parse HEAD > worker-pairs/sha.txt
          uname -a > worker-pairs/runner.txt
          lscpu >> worker-pairs/runner.txt
          free -b >> worker-pairs/runner.txt
          getconf CLK_TCK >> worker-pairs/runner.txt

      - name: Start PostgreSQL
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull pgvector/pgvector:pg17; then
              break
            fi
            echo "docker pull pgvector failed (attempt $attempt/5) — retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          docker run -d --name postgres -p 5454:5432 \
            -e POSTGRES_USER=threa \
            -e POSTGRES_PASSWORD=threa \
            -e POSTGRES_DB=threa \
            pgvector/pgvector:pg17
          for i in {1..30}; do
            if docker exec postgres pg_isready -U threa -d threa; then
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          docker logs postgres
          exit 1

      - name: Start MinIO
        run: |
          # Pull explicitly with retries — registry manifest fetches fail
          # transiently, and the shards pull concurrently which makes a blip on
          # any one of them abort the whole shard before tests even start.
          for attempt in 1 2 3 4 5; do
            if docker pull chrislusf/seaweedfs:4.47; then
              break
            fi
            echo "docker pull minio failed (attempt $attempt/5) — retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          docker run -d --name minio \
            -p 9000:9000 \
            -e AWS_ACCESS_KEY_ID=minioadmin \
            -e AWS_SECRET_ACCESS_KEY=minioadmin \
            chrislusf/seaweedfs:4.47 mini -dir=/data -s3.port=9000 -bucket=threa-browser-test
          # Wait for MinIO to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:9000/healthz; then
              echo "MinIO is ready"
              break
            fi
            echo "Waiting for MinIO... ($i/30)"
            sleep 1
          done

      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - name: Build frontend once
        run: bun run --cwd apps/frontend build:e2e
        env:
          VITE_BACKEND_PORT: "1"
          VITE_DRAFT_DEBOUNCE_MS: "5"

      - name: Freeze cohort inventory
        run: |
          cat > worker-pairs/cohort.txt <<'EOF'
          [chromium] > panel-tabs.spec.ts
          [chromium] > panel-header.spec.ts
          [chromium] > message-send-mode.spec.ts > Message Send Mode > default enter mode
          [chromium] > infinite-scroll.spec.ts
          [chromium] > pane-host-stability.spec.ts
          [chromium] > pane-one-chrome.spec.ts
          EOF
          PLAYWRIGHT_JSON_OUTPUT_FILE=worker-pairs/inventory.json bunx playwright test --test-list=worker-pairs/cohort.txt --list --reporter=json
          bun -e 'const r = await Bun.file("worker-pairs/inventory.json").json(); const count = s => (s.specs ?? []).reduce((n, x) => n + x.tests.length, 0) + (s.suites ?? []).reduce((n, x) => n + count(x), 0); if (count(r) !== 36) throw new Error("Expected exactly 36 cases")'

      - name: Run paired arms (2, 3, 3, 2 workers)
        run: |
          snapshot() {
            date +%s.%N
            cat /proc/stat /proc/meminfo /proc/pressure/cpu /proc/pressure/memory
            awk '/^(pswpin|pswpout|pgmajfault) /' /proc/vmstat
          }
          sample() { while true; do snapshot; sleep 2; done; }
          failed=0
          arm=0
          for workers in 2 3 3 2; do
            arm=$((arm + 1))
            dir="$GITHUB_WORKSPACE/worker-pairs/arm-$arm-w$workers"
            mkdir -p "$dir"
            export PLAYWRIGHT_TEST_DB_NAME="paired_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${arm}"
            export PLAYWRIGHT_JSON_OUTPUT_FILE="$dir/report.json"
            export PAIRED_STEPS_FILE="$dir/steps.jsonl"
            export THREA_TEST_LOG_FILE="$dir/backend.ndjson"
            printf '%s\n' "$PLAYWRIGHT_TEST_DB_NAME" > "$dir/database.txt"
            date +%s.%N > "$dir/setup-start.txt"
            for db in "$PLAYWRIGHT_TEST_DB_NAME" "${PLAYWRIGHT_TEST_DB_NAME}_cp"; do
              docker exec postgres psql -U threa -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db"
            done
            sample > "$dir/runner-samples.txt" &
            sampler=$!
            trap 'kill "$sampler" 2>/dev/null || true' EXIT
            date +%s.%N > "$dir/command-start.txt"
            set +e
            /usr/bin/time -v -o "$dir/time.txt" \
              bun run test:browser -- --workers="$workers" --retries=0 \
              --test-list=worker-pairs/cohort.txt --output="$dir/test-results" \
              --reporter=line,json,./scripts/browser-worker-paired-reporter.ts > "$dir/command.log" 2>&1
            status=$?
            set -e
            date +%s.%N > "$dir/command-end.txt"
            kill "$sampler"
            wait "$sampler" || true
            trap - EXIT
            snapshot >> "$dir/runner-samples.txt"
            printf '%s\n' "$status" > "$dir/exit-code.txt"
            if [[ "$status" != 0 ]]; then failed=1; fi
            cat "$dir/command.log"
          done
          exit "$failed"

      - name: Upload paired evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-worker-pairs-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker-pairs/
          if-no-files-found: error
          retention-days: 7
