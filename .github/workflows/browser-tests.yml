name: Browser E2E Tests

# Pull requests call this with the smoke journeys plus the specs of the areas
# they touch. Main pushes, manual runs and `/e2e` run every spec.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      files:
        type: string
        required: true

env:
  FILES: ${{ inputs.files || 'all' }}

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v4

      - name: Check main tip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: tip
        uses: ./.github/actions/check-main-tip
        with:
          expected-sha: ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Reject obsolete main revision
        if: steps.tip.outputs.is-tip == 'false'
        run: exit 1

      - uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # About 40 cases per shard keeps each shard near three minutes.
      - name: Plan shards
        id: shards
        run: |
          selection=()
          [[ "$FILES" == all ]] || read -ra selection <<< "$FILES"
          count=$(bunx playwright test --list "${selection[@]}" | awk '/^Total: /{print $2}')
          (( count > 0 )) || { echo "No browser cases selected" >&2; exit 1; }
          shards=$(( (count + 39) / 40 ))
          (( shards > 8 )) && shards=8
          echo "shards=$(jq -cn --argjson n "$shards" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"
          echo "### Browser: $count cases in $shards shards" >> "$GITHUB_STEP_SUMMARY"

      - name: Build frontend once
        run: bun run --cwd apps/frontend build:e2e
        env:
          VITE_BACKEND_PORT: "1"
          VITE_DRAFT_DEBOUNCE_MS: "5"

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-frontend
          path: apps/frontend/dist/
          retention-days: 1

  test:
    name: Browser (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}

    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull pgvector/pgvector:pg17; then
              break
            fi
            echo "docker pull pgvector failed (attempt $attempt/5) — retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          docker run -d --name postgres -p 5454:5432 \
            -e POSTGRES_USER=threa \
            -e POSTGRES_PASSWORD=threa \
            -e POSTGRES_DB=threa \
            pgvector/pgvector:pg17
          for i in {1..30}; do
            if docker exec postgres pg_isready -U threa -d threa; then
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          docker logs postgres
          exit 1

      - name: Start MinIO
        run: |
          # Registry manifest fetches fail transiently and shards pull concurrently.
          for attempt in 1 2 3 4 5; do
            if docker pull chrislusf/seaweedfs:4.47; then
              break
            fi
            echo "docker pull minio failed (attempt $attempt/5) — retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          docker run -d --name minio \
            -p 9000:9000 \
            -e AWS_ACCESS_KEY_ID=minioadmin \
            -e AWS_SECRET_ACCESS_KEY=minioadmin \
            chrislusf/seaweedfs:4.47 mini -dir=/data -s3.port=9000 -bucket=threa-browser-test
          for i in {1..30}; do
            if curl -sf http://localhost:9000/healthz; then
              echo "MinIO is ready"
              break
            fi
            echo "Waiting for MinIO... ($i/30)"
            sleep 1
          done

      - uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install chromium

      - name: Create test databases
        run: |
          db=threa_browser_test
          echo "PLAYWRIGHT_TEST_DB_NAME=$db" >> "$GITHUB_ENV"
          for name in "$db" "${db}_cp"; do
            PGPASSWORD=threa psql -h localhost -p 5454 -U threa -d postgres -c "CREATE DATABASE ${name}"
          done

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: browser-test-frontend
          path: apps/frontend/dist/

      - name: Run browser tests
        run: |
          selection=()
          [[ "$FILES" == all ]] || read -ra selection <<< "$FILES"
          shard="${{ matrix.shard }}/${{ strategy.job-total }}"
          bun run test:browser -- --shard="$shard" "${selection[@]}"
        env:
          CI: true
          PLAYWRIGHT_FRONTEND_PREBUILT: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
