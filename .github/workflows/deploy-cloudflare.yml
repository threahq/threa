name: Deploy Cloudflare

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Collapse overlapping runs for the same commit into one. Close-together merges
# can fire the workflow_run trigger more than once for a single head_sha; without
# this each fires a full deploy (and a duplicate notify). Keyed on head_sha so
# distinct commits still deploy independently; cancel-in-progress is safe because
# the superseded run is byte-identical (same ref).
concurrency:
  group: deploy-cloudflare-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: deploy-frontend
      cancel-in-progress: true
    env:
      POSTHOG_CLI_TOKEN: ${{ secrets.POSTHOG_CLI_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Carry recent builds' content-hashed chunks across deploys so a tab still
      # running the previous build can keep lazy-loading its own /assets/*.js
      # instead of hitting "Failed to fetch dynamically imported module" the
      # moment a new build ships (see apps/frontend/scripts/retain-assets.ts).
      # Best-effort: a cache miss/hiccup must never block a deploy.
      - name: Restore retained assets
        id: restore-retained-assets
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: apps/frontend/.retained-assets
          key: frontend-retained-assets-prod-${{ github.run_id }}
          restore-keys: |
            frontend-retained-assets-prod-

      - name: Build frontend
        run: bun run --cwd apps/frontend build

      - name: Fold retained assets into dist
        run: bun apps/frontend/scripts/retain-assets.ts

      - name: Save retained assets
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: apps/frontend/.retained-assets
          key: frontend-retained-assets-prod-${{ github.run_id }}

      # Skipped, not failed, without the token (forks) or without an EU project.
      # `inject` also calls the PostHog API, so it runs under the EU project;
      # its chunk ids are not project-specific, so one inject serves both
      # uploads. The US upload waits for a US project to exist.
      - name: Upload source maps to PostHog
        if: env.POSTHOG_CLI_TOKEN != ''
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_TOKEN }}
          POSTHOG_ENV_ID_EU: ${{ secrets.POSTHOG_ENV_ID_EU }}
          POSTHOG_ENV_ID_US: ${{ secrets.POSTHOG_ENV_ID_US }}
        run: |
          if [ -z "$POSTHOG_ENV_ID_EU" ]; then
            echo "POSTHOG_ENV_ID_EU is unset, skipping source map upload"
            exit 0
          fi
          POSTHOG_CLI_PROJECT_ID="$POSTHOG_ENV_ID_EU" POSTHOG_CLI_HOST=https://eu.posthog.com \
            bunx @posthog/cli@0.18.0 sourcemap inject --directory apps/frontend/dist
          POSTHOG_CLI_PROJECT_ID="$POSTHOG_ENV_ID_EU" POSTHOG_CLI_HOST=https://eu.posthog.com \
            bunx @posthog/cli@0.18.0 sourcemap upload --directory apps/frontend/dist
          if [ -n "$POSTHOG_ENV_ID_US" ]; then
            POSTHOG_CLI_PROJECT_ID="$POSTHOG_ENV_ID_US" POSTHOG_CLI_HOST=https://us.posthog.com \
              bunx @posthog/cli@0.18.0 sourcemap upload --directory apps/frontend/dist
          fi

      # Maps must never reach Pages, even when the upload was skipped.
      - name: Strip source maps
        run: find apps/frontend/dist -name '*.map' -type f -delete

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name threa-frontend --branch main --commit-hash ${{ github.event.workflow_run.head_sha }} --commit-message "deploy ${{ github.event.workflow_run.head_sha }}" --commit-dirty=true
          workingDirectory: apps/frontend
          packageManager: bun

  deploy-public-site:
    name: Deploy Public Site
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: deploy-public-site
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build public site
        run: bun run --cwd apps/public-site build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name threa-public-site --branch main --commit-hash ${{ github.event.workflow_run.head_sha }} --commit-message "deploy ${{ github.event.workflow_run.head_sha }}" --commit-dirty=true
          workingDirectory: apps/public-site
          packageManager: bun

  deploy-workspace-router:
    name: Deploy Workspace Router
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: deploy-workspace-router
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.production.toml
          workingDirectory: apps/workspace-router
          packageManager: bun

  deploy-backoffice:
    name: Deploy Backoffice
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: deploy-backoffice
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build backoffice
        run: bun run --cwd apps/backoffice build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name threa-backoffice --branch main --commit-hash ${{ github.event.workflow_run.head_sha }} --commit-message "deploy ${{ github.event.workflow_run.head_sha }}" --commit-dirty=true
          workingDirectory: apps/backoffice
          packageManager: bun

  deploy-backoffice-router:
    name: Deploy Backoffice Router
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: deploy-backoffice-router
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.production.toml
          workingDirectory: apps/backoffice-router
          packageManager: bun
