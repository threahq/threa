name: Deploy Cloudflare

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Collapse overlapping runs for the same commit into one. Close-together merges
# can fire the workflow_run trigger more than once for a single head_sha; without
# this each fires a full deploy (and a duplicate notify). Keyed on head_sha so
# distinct commits still deploy independently; cancel-in-progress is safe because
# the superseded run is byte-identical (same ref).
concurrency:
  group: deploy-cloudflare-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  # A CI run for an older commit can finish (or be rerun) after a newer one has
  # deployed. Deploying its sha would roll prod back, so only main's tip deploys.
  check-tip:
    name: Check main tip
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      is-tip: ${{ steps.tip.outputs.is-tip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check main tip
        id: tip
        uses: ./.github/actions/check-main-tip
        with:
          expected-sha: ${{ github.event.workflow_run.head_sha }}
        env:
          GH_TOKEN: ${{ github.token }}

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: check-tip
    if: needs.check-tip.outputs.is-tip == 'true'
    concurrency:
      group: deploy-frontend
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download deployable frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-production
          path: apps/frontend/dist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate frontend version
        run: |
          test -f apps/frontend/dist/version.json || {
            echo "Downloaded frontend artifact is missing version.json" >&2
            exit 1
          }

          expected_version="$(git rev-parse --short HEAD)"
          actual_version="$(bun -e 'const value = await Bun.file("apps/frontend/dist/version.json").json(); process.stdout.write(typeof value.version === "string" ? value.version : "")')"

          test "$actual_version" = "$expected_version" || {
            echo "Downloaded frontend version $actual_version does not match checkout $expected_version" >&2
            exit 1
          }

      # Carry recent builds' content-hashed chunks across deploys so a tab still
      # running the previous build can keep lazy-loading its own /assets/*.js
      # instead of hitting "Failed to fetch dynamically imported module" the
      # moment a new build ships (see apps/frontend/scripts/retain-assets.ts).
      # Best-effort: a cache miss/hiccup must never block a deploy.
      - name: Restore retained assets
        id: restore-retained-assets
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: apps/frontend/.retained-assets
          key: frontend-retained-assets-prod-${{ github.run_id }}
          restore-keys: |
            frontend-retained-assets-prod-

      - name: Fold retained assets into dist
        run: bun apps/frontend/scripts/retain-assets.ts

      - name: Save retained assets
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: apps/frontend/.retained-assets
          key: frontend-retained-assets-prod-${{ github.run_id }}

      # Maps must never reach Pages, even when the upload was skipped.
      - name: Strip source maps
        run: find apps/frontend/dist -name '*.map' -type f -delete

      - name: Deploy to Cloudflare Pages
        working-directory: apps/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/wrangler-with-retry.sh" pages deploy dist --project-name threa-frontend --branch main --commit-hash "$HEAD_SHA" --commit-message "deploy $HEAD_SHA" --commit-dirty=true

  deploy-public-site:
    name: Deploy Public Site
    runs-on: ubuntu-latest
    needs: check-tip
    if: needs.check-tip.outputs.is-tip == 'true'
    concurrency:
      group: deploy-public-site
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build public site
        run: bun run --cwd apps/public-site build

      - name: Deploy to Cloudflare Pages
        working-directory: apps/public-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/wrangler-with-retry.sh" pages deploy dist --project-name threa-public-site --branch main --commit-hash "$HEAD_SHA" --commit-message "deploy $HEAD_SHA" --commit-dirty=true

  deploy-workspace-router:
    name: Deploy Workspace Router
    runs-on: ubuntu-latest
    needs: check-tip
    if: needs.check-tip.outputs.is-tip == 'true'
    concurrency:
      group: deploy-workspace-router
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        working-directory: apps/workspace-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/wrangler-with-retry.sh" deploy --config wrangler.production.toml

  deploy-backoffice:
    name: Deploy Backoffice
    runs-on: ubuntu-latest
    needs: check-tip
    if: needs.check-tip.outputs.is-tip == 'true'
    concurrency:
      group: deploy-backoffice
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build backoffice
        run: bun run --cwd apps/backoffice build

      - name: Deploy to Cloudflare Pages
        working-directory: apps/backoffice
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/wrangler-with-retry.sh" pages deploy dist --project-name threa-backoffice --branch main --commit-hash "$HEAD_SHA" --commit-message "deploy $HEAD_SHA" --commit-dirty=true

  deploy-backoffice-router:
    name: Deploy Backoffice Router
    runs-on: ubuntu-latest
    needs: check-tip
    if: needs.check-tip.outputs.is-tip == 'true'
    concurrency:
      group: deploy-backoffice-router
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        working-directory: apps/backoffice-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/wrangler-with-retry.sh" deploy --config wrangler.production.toml
