name: Production Images

on:
  workflow_call:
    inputs:
      called:
        type: boolean
        required: true
      full:
        type: boolean
        required: true
    outputs:
      result:
        value: ${{ jobs.aggregate.outputs.result }}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: production-images-child-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  changes:
    name: Select production images
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.select.outputs.services }}
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' || inputs.called
        with:
          fetch-depth: 0
      - name: Require the complete push range
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && "$BEFORE" != 0000000000000000000000000000000000000000 ]]
          [[ "$AFTER" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$BEFORE^{commit}"
          git cat-file -e "$AFTER^{commit}"
      - id: paths
        if: github.event_name != 'workflow_dispatch' && !inputs.full
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event_name == 'push' && github.event.before || inputs.called && github.event.pull_request.base.sha || '' }}
          ref: ${{ github.event_name == 'push' && github.sha || inputs.called && github.event.pull_request.head.sha || '' }}
          filters: |
            common:
              - '.bun-version'
              - '.dockerignore'
              - 'package.json'
              - 'bun.lock'
              - 'patches/**'
              - 'apps/*/package.json'
              - 'packages/*/package.json'
              - '.github/actions/**'
              - '.github/workflows/production-images.yml'
              - 'scripts/production-images.bake.hcl'
              - 'scripts/production-image-smoke.compose.yml'
              - 'scripts/smoke-production-image.sh'
            backend:
              - 'Dockerfile.backend'
              - 'apps/backend/**'
              - 'extensions/bot-runtime-client/src/**'
              - 'packages/types/**'
              - 'packages/user-guide/**'
              - 'packages/prosemirror/**'
              - 'packages/crypto/**'
              - 'packages/agent-runtime/**'
              - 'packages/backend-common/**'
              - 'packages/cli/**'
            control-plane:
              - 'Dockerfile.control-plane'
              - 'apps/control-plane/**'
              - 'packages/types/**'
              - 'packages/backend-common/**'
            db-read-proxy:
              - 'Dockerfile.db-read-proxy'
              - 'apps/db-read-proxy/**'
              - 'packages/types/**'
              - 'packages/backend-common/**'
            enclave:
              - 'Dockerfile.enclave'
              - 'apps/enclave/**'
              - 'packages/types/**'
              - 'packages/prosemirror/**'
              - 'packages/crypto/**'
              - 'packages/agent-runtime/**'
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          COMMON: ${{ steps.paths.outputs.common }}
          BACKEND: ${{ steps.paths.outputs.backend }}
          CONTROL_PLANE: ${{ steps.paths.outputs.control-plane }}
          DB_READ_PROXY: ${{ steps.paths.outputs.db-read-proxy }}
          ENCLAVE: ${{ steps.paths.outputs.enclave }}
        run: |
          if [[ "$EVENT_NAME" != workflow_dispatch && "$FULL" != true ]]; then
            for changed in "$COMMON" "$BACKEND" "$CONTROL_PLANE" "$DB_READ_PROXY" "$ENCLAVE"; do
              if [[ "$changed" != true && "$changed" != false ]]; then
                echo "Image selection returned an invalid result: $changed" >&2
                exit 1
              fi
            done
          fi

          if [[ "$EVENT_NAME" == workflow_dispatch || "$FULL" == true || "$COMMON" == true ]]; then
            services='["backend","control-plane","db-read-proxy","enclave"]'
          else
            services=$(jq -cn \
              --arg backend "$BACKEND" \
              --arg controlPlane "$CONTROL_PLANE" \
              --arg dbReadProxy "$DB_READ_PROXY" \
              --arg enclave "$ENCLAVE" \
              '[
                { id: "backend", changed: $backend },
                { id: "control-plane", changed: $controlPlane },
                { id: "db-read-proxy", changed: $dbReadProxy },
                { id: "enclave", changed: $enclave }
              ] | map(select(.changed == "true") | .id)')
          fi

          echo "services=$services" >> "$GITHUB_OUTPUT"
          if [[ "$services" == '[]' ]]; then
            echo 'selected=false' >> "$GITHUB_OUTPUT"
          else
            echo 'selected=true' >> "$GITHUB_OUTPUT"
          fi

  images:
    name: Build and smoke production images
    needs: changes
    if: needs.changes.outputs.selected == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - uses: docker/bake-action@v6
        with:
          source: .
          files: scripts/production-images.bake.hcl
          targets: ${{ join(fromJSON(needs.changes.outputs.services), ',') }}
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          push: false
      - name: Smoke unchanged image commands
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          set -Eeuo pipefail
          while IFS= read -r service; do
            scripts/smoke-production-image.sh "$service" "threa-production-smoke:$service"
          done < <(jq -r '.[]' <<< "$SERVICES")

  aggregate:
    name: Production Images
    outputs:
      result: ${{ steps.proof.outcome }}
    if: always()
    needs: [changes, images]
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected image proofs
        id: proof
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.selected }}
          IMAGES_RESULT: ${{ needs.images.result }}
        run: |
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "Image selection did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$SELECTED" == false && "$IMAGES_RESULT" == skipped ]]; then
            echo "No production images affected"
            exit 0
          fi
          if [[ "$SELECTED" == true && "$IMAGES_RESULT" == success ]]; then
            echo "All selected production images passed"
            exit 0
          fi
          echo "Missing successful production image proof (selected=$SELECTED images=$IMAGES_RESULT)" >&2
          exit 1
