name: Dependency Advisory Report

# Success means a report was generated, not that its findings are resolved.
on:
  pull_request:
    paths:
      - ".github/workflows/dependency-audit.yml"
      - "scripts/dependency-audit*.ts"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Advisory Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Generate advisory report without installing dependencies
        run: bun scripts/dependency-audit.ts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: error
