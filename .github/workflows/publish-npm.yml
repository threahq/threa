# Publish one extension package to npm from its built dist/.
#
# Auth is npm trusted publishing (OIDC): no token in secrets. Each package on
# npmjs.com lists this repository + this workflow file as a trusted publisher;
# `id-token: write` lets npm mint the short-lived credential and attach
# provenance. Run it from the Actions tab with the package name and the version
# already committed in its package.json. bot-runtime-client goes first for a
# new version pair — remote-session depends on it by caret range.
name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Extension package to publish
        required: true
        type: choice
        options:
          - bot-runtime-client
          - remote-session
      dry_run:
        description: Build and pack, but do not publish
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @threahq/${{ inputs.package }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # npm >= 11.5.1 is required for trusted publishing.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: |
          bun install
          bun install --cwd extensions/bot-runtime-client
          bun install --cwd extensions/remote-session

      - name: Test
        run: |
          bun run --cwd extensions/${{ inputs.package }} typecheck
          bun run --cwd extensions/${{ inputs.package }} test

      - name: Build and pack
        run: |
          bun run --cwd extensions/${{ inputs.package }} pack
          tar -tzf extensions/${{ inputs.package }}/*.tgz

      - name: Refuse to republish an existing version
        run: |
          name=$(node -p "require('./extensions/${{ inputs.package }}/dist/package.json').name")
          version=$(node -p "require('./extensions/${{ inputs.package }}/dist/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; bump the version first" >&2
            exit 1
          fi

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish extensions/${{ inputs.package }}/dist --access public --provenance
