# Publish one package to npm from its built dist/. A choice names a directory
# under extensions/, or under packages/ when extensions/ has none.
#
# Auth is npm trusted publishing (OIDC): no token in secrets. Each package on
# npmjs.com lists this repository + this workflow file as a trusted publisher;
# `id-token: write` lets npm mint the short-lived credential and attach
# provenance. Run it from the Actions tab with the package name and the version
# already committed in its package.json. Order for a new version set:
# bot-runtime-client, then remote-session and harness-client, then threa-bot,
# hermes-remote, claude-code-remote, pi-remote and t3code-remote (each depends on
# the ones before it by caret range). cli bundles what it uses and can go any time.
name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - bot-runtime-client
          - remote-session
          - harness-client
          - threa-bot
          - hermes-remote
          - claude-code-remote
          - pi-remote
          - t3code-remote
          - cli
      dry_run:
        description: Build and pack, but do not publish
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @threahq/${{ inputs.package }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # npm >= 11.5.1 is required for trusted publishing.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Resolve package directory
        run: |
          if [ -d "extensions/${{ inputs.package }}" ]; then dir="extensions/${{ inputs.package }}"; else dir="packages/${{ inputs.package }}"; fi
          echo "PKG_DIR=$dir" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd extensions/bot-runtime-client
          bun install --frozen-lockfile --cwd extensions/remote-session
          bun install --frozen-lockfile --cwd extensions/harness-client
          bun install --frozen-lockfile --cwd extensions/threa-bot
          bun install --frozen-lockfile --cwd extensions/hermes-remote
          bun install --frozen-lockfile --cwd extensions/claude-code-remote
          bun install --frozen-lockfile --cwd extensions/pi-remote
          bun install --frozen-lockfile --cwd extensions/t3code-remote

      - name: Test
        run: |
          # pi-remote has no typecheck yet (#1153).
          if [ "$(node -p "require('./$PKG_DIR/package.json').scripts.typecheck ?? ''")" != "" ]; then
            bun run --cwd $PKG_DIR typecheck
          fi
          bun run --cwd $PKG_DIR test

      - name: Build and pack
        run: |
          bun run --cwd $PKG_DIR pack
          tar -tzf $PKG_DIR/*.tgz

      - name: Refuse to republish an existing version
        if: ${{ !inputs.dry_run }}
        run: |
          name=$(node -p "require('./$PKG_DIR/dist/package.json').name")
          version=$(node -p "require('./$PKG_DIR/dist/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; bump the version first" >&2
            exit 1
          fi

      # npm does not check that a dependency version exists at publish time; a
      # package published before its sibling would install for nobody.
      - name: Require sibling packages on npm
        if: ${{ !inputs.dry_run }}
        run: |
          node -e '
            const deps = require(`./${process.env.PKG_DIR}/dist/package.json`).dependencies ?? {}
            const { execFileSync } = require("node:child_process")
            for (const [name, range] of Object.entries(deps)) {
              if (!name.startsWith("@threahq/")) continue
              try {
                const found = execFileSync("npm", ["view", `${name}@${range}`, "version"], { encoding: "utf8" }).trim()
                if (!found) throw new Error("no version")
                console.log(`${name}@${range}: ${found}`)
              } catch {
                console.error(`${name}@${range} is not on npm yet; publish it first`)
                process.exit(1)
              }
            }
          '

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish $PKG_DIR/dist --access public --provenance
